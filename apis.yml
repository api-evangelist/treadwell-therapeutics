aid: treadwell-therapeutics
name: Treadwell Therapeutics
description: >-
  Treadwell Therapeutics is a clinical-stage, multi-modality oncology company developing novel small-molecule
  therapeutics for highly aggressive cancers by targeting tumor-specific vulnerabilities such as aneuploidy and
  immunogenicity. Co-founded by Tak Wah Mak, PhD and Mark R. Bray, PhD, the company keeps drug discovery and
  clinical development under one roof and works out of Toronto (with a research footprint at the University Health
  Network), New York and Hong Kong. Its internally developed pipeline includes CFI-400945, an oral PLK4 inhibitor in
  Phase 1/2 studies across triple-negative breast cancer, prostate cancer and acute myeloid leukemia (FDA Fast Track
  designation); CFI-402257, a TTK inhibitor in Phase 1b/2; and CFI-402411, a first-in-class HPK1 inhibitor. Treadwell
  is a therapeutics developer, not a software vendor - it publishes no developer program, no public API, and no
  machine-readable API contract. Profiled by API Evangelist from its own public corporate site.
